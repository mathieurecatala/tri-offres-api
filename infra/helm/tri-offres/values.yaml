# Valeurs par défaut du chart. Terraform (infra/terraform) et la CI n'en changent que quelques-unes.

api:
  image:
    # Image construite en local (cible « prod » du Dockerfile) puis chargée dans le cluster kind :
    # elle n'existe dans aucun registre, d'où pullPolicy IfNotPresent.
    repository: tri-offres-api
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    # ClusterIP : joignable seulement dans le cluster (kubectl port-forward pour y accéder).
    # Terraform passe en NodePort pour l'ouvrir sur http://localhost:8080 via le port mappé par kind.
    type: ClusterIP
    port: 8000
    nodePort: null
    portLocal: 8080   # NodePort seulement : port de la machine relié au nœud par kind (affiché par NOTES.txt)
  # requests = ce que le planificateur réserve ; limits = plafond (au-delà de la limite mémoire, le conteneur est tué).
  # Mesuré dans kind le 12/10/2026 : environ 127 Mio pour l'API après une vraie collecte de 131 offres.
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 384Mi

postgres:
  # Image officielle, même version majeure que docker-compose.yml (16). Variante alpine : utilisateur postgres = uid 70.
  # Épinglée par empreinte (vérifiée sur Docker Hub le 13/10/2026 : 16.15-alpine = 16-alpine ce jour-là) : la même
  # image à chaque déploiement, même si l'étiquette est déplacée plus tard.
  image:
    repository: postgres
    tag: 16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    pullPolicy: IfNotPresent
  utilisateur: tri
  base: tri_offres
  # Volume persistant demandé à la classe de stockage par défaut (dans kind : local-path, un dossier du nœud).
  stockage:
    taille: 1Gi
    classe: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Le mot de passe Postgres n'est écrit nulle part dans ce dépôt : le chart le tire au hasard au premier déploiement
# (Secret « <release>-postgres »), puis le relit à chaque mise à jour pour ne pas le changer.

# Rempli par Terraform avec l'empreinte des fichiers du chart ; aucun template ne le lit. Sa seule raison d'être :
# qu'un template modifié change les valeurs, et donc que « terraform apply » relance un « helm upgrade ».
empreinteChart: ""

networkPolicy:
  # Seuls les pods de cette release marqués acces-postgres: "true" (l'API) peuvent ouvrir une connexion vers Postgres.
  # kind l'applique (kindnetd intègre kube-network-policies) ; prouvé par « helm test » en CI.
  enabled: true
