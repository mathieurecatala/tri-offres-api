{{- $nom := include "tri-offres.nom" . -}}
{{- $postgres := printf "%s-postgres" $nom -}}
# L'API FastAPI : image « prod » du Dockerfile (sans les tests), utilisateur tri (uid 10001).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $nom }}-api
  labels:
    {{- include "tri-offres.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "tri-offres.selecteur.api" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tri-offres.etiquettes" . | nindent 8 }}
        app.kubernetes.io/component: api
        acces-postgres: "true"   # autorisé par la NetworkPolicy à joindre Postgres
    spec:
      automountServiceAccountToken: false   # l'API n'a pas à parler à l'API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001    # l'image déclare « USER tri » par son nom : Kubernetes a besoin du numéro pour vérifier
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # L'API crée ses tables au démarrage : on attend que Postgres réponde plutôt que de la laisser planter
        # et redémarrer en boucle pendant que la base s'initialise.
        - name: attendre-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command: ["sh", "-c", "until pg_isready -h {{ $postgres }} -p 5432 -U {{ .Values.postgres.utilisateur }} -t 2; do echo 'Postgres pas encore prêt'; sleep 2; done"]
          securityContext:
            {{- include "tri-offres.securite.conteneur" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres }}
                  key: mot-de-passe
            # $(POSTGRES_PASSWORD) est remplacé par Kubernetes avec la variable définie juste au-dessus.
            # Le mot de passe généré est alphanumérique : rien à échapper dans l'URL.
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.utilisateur }}:$(POSTGRES_PASSWORD)@{{ $postgres }}:5432/{{ .Values.postgres.base }}"
          # Prête (reçoit du trafic) = /health répond, ce qui veut dire que la base répond aussi.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # Vivante = le serveur accepte les connexions. Volontairement sans la base : si Postgres tombe,
          # redémarrer l'API ne réparerait rien ; elle sort seulement du Service le temps que la base revienne.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "tri-offres.securite.conteneur" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nom }}-api
  labels:
    {{- include "tri-offres.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "tri-offres.selecteur.api" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
