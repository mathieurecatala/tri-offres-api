{{- $nom := printf "%s-postgres" (include "tri-offres.nom" .) -}}
# Postgres : un seul pod, géré par un StatefulSet pour garder son volume de données d'un redémarrage à l'autre.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $nom }}
  labels:
    {{- include "tri-offres.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $nom }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tri-offres.selecteur.postgres" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tri-offres.etiquettes" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false   # Postgres n'a pas à parler à l'API Kubernetes
      securityContext:
        {{- include "tri-offres.securite.pod.postgres" . | nindent 8 }}
        fsGroup: 70
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.utilisateur | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.base | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $nom }}
                  key: mot-de-passe
            # Sous-dossier du volume : la racine d'un volume peut contenir des fichiers que initdb refuse (lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Prête = accepte les connexions ; vivante = le processus répond encore (sinon Kubernetes la redémarre).
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "tri-offres.securite.conteneur" . | nindent 12 }}
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
            # Système de fichiers en lecture seule : seuls ces dossiers restent inscriptibles.
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.stockage.classe }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.stockage.taille }}
---
# Adresse stable de la base dans le cluster : <release>-postgres:5432. « Headless » (sans IP virtuelle) : le nom
# pointe directement sur le pod, et seulement quand il est prêt.
apiVersion: v1
kind: Service
metadata:
  name: {{ $nom }}
  labels:
    {{- include "tri-offres.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "tri-offres.selecteur.postgres" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
