{{- /*
  Mot de passe Postgres : jamais dans le dépôt ni dans values.yaml.
  - Premier déploiement : tiré au hasard (32 caractères alphanumériques) par Helm.
  - Mises à jour : « lookup » relit le Secret déjà présent dans le cluster et garde le même mot de passe
    (sinon l'API recevrait un nouveau mot de passe que la base, déjà initialisée, ne connaît pas).
  - « resource-policy: keep » : un « helm uninstall » laisse ce Secret, comme il laisse le volume de la base ;
    une réinstallation retrouve donc les données et le mot de passe qui va avec.
*/ -}}
{{- $nom := printf "%s-postgres" (include "tri-offres.nom" .) -}}
{{- $existant := lookup "v1" "Secret" .Release.Namespace $nom -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nom }}
  labels:
    {{- include "tri-offres.etiquettes" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existant $existant.data (index $existant.data "mot-de-passe") }}
  mot-de-passe: {{ index $existant.data "mot-de-passe" }}
  {{- else }}
  mot-de-passe: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
