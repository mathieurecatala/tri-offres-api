# Contrôles lancés avant chaque commit (installation : pip install pre-commit && pre-commit install).
# gitleaks bloque le commit si un secret (clé, jeton, mot de passe réel) est détecté dans les fichiers ajoutés.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
